<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Terminal // Telemetry Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131c2e;
            --border-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-card);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card.full-width {
            grid-column: span 2;
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .metric-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .metric-value {
            font-size: 38px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .metric-unit {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge-red {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-green {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-amber {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: var(--accent-blue);
            color: var(--bg-main);
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .terminal-box {
            background-color: #05070c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #38bdf8;
            height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>AstroMED portal</h1>
                <p>Live Arduino Hardware Simulation Link</p>
                <p>Made by: The AstroMed group</p>
            </div>
            <div class="connection-status">
                <div id="statusDot" class="status-dot"></div>
                <span id="connectionText">Disconnected</span>
            </div>
        </header>

        <!-- Controls -->
        <div class="card full-width" style="margin-bottom: 20px;">
            <div class="control-panel">
                <div>
                    <div class="card-title" style="margin-bottom: 4px;">Serial Port Link</div>
                    <div style="font-size: 13px; color: var(--text-secondary);">Baud Rate: 9600 bps</div>
                </div>
                <button id="connectBtn">Connect Device</button>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid">
            <!-- Temperature Card -->
            <div class="card">
                <div class="card-title">Core Temperature</div>
                <div class="metric-display">
                    <span id="tempVal" class="metric-value">--.-</span>
                    <span class="metric-unit">°C</span>
                </div>
            </div>

            <!-- Humidity Card -->
            <div class="card">
                <div class="card-title">Relative Humidity</div>
                <div class="metric-display">
                    <span id="humVal" class="metric-value">--</span>
                    <span class="metric-unit">%</span>
                </div>
            </div>

            <!-- Status Card -->
            <div class="card full-width">
                <div class="card-title">System Operational State</div>
                <div style="margin-top: 4px;">
                    <span id="statusBadge" class="badge badge-red">STANDBY // WAITING FOR CONNECTION</span>
                </div>
            </div>

            <!-- Terminal Log Card -->
            <div class="card full-width">
                <div class="card-title">Raw Telemetry Stream</div>
                <div id="logBox" class="terminal-box">Waiting for serial data stream...</div>
            </div>
        </div>
    </div>

    <script>
        let port, reader, inputStream;
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const connectionText = document.getElementById('connectionText');
        const statusBadge = document.getElementById('statusBadge');
        const tempVal = document.getElementById('tempVal');
        const humVal = document.getElementById('humVal');
        const logBox = document.getElementById('logBox');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                
                connectBtn.textContent = "Connected";
                connectBtn.disabled = true;
                statusDot.classList.add('connected');
                connectionText.textContent = "Active Link";
                statusBadge.className = "badge badge-amber";
                statusBadge.textContent = "INITIALIZING BOOT SEQUENCE";

                const textDecoder = new TextDecoderStream();
                inputStream = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('{') && line.endsWith('}')) {
                            try {
                                const data = JSON.parse(line);
                                
                                tempVal.textContent = data.temp.toFixed(1);
                                humVal.textContent = data.humidity !== undefined ? data.humidity : "--";
                                statusBadge.textContent = data.status;

                                if (data.status.includes("WARNING") || data.status.includes("CRITICAL")) {
                                    statusBadge.className = "badge badge-red";
                                } else if (data.status.includes("Needed") || data.status.includes("Rising")) {
                                    statusBadge.className = "badge badge-amber";
                                } else {
                                    statusBadge.className = "badge badge-green";
                                }
                            } catch (e) {
                                console.error("JSON Parse Error:", e);
                            }
                        }
                        
                        logBox.textContent = `[${new Date().toLocaleTimeString()}] ${line}\n` + logBox.textContent.substring(0, 1500);
                    }
                }
            } catch (error) {
                console.error("Serial connection error:", error);
                alert("Connection failed: " + error.message);
            }
        });
    </script>
</body>
</html>
